<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Design Intent · FELEMAYE</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<style>
:root{--bg:#f6efe4;--card:#fffaf2;--ink:#2b211b;--mute:#7a6a5c;--line:#e0d3c0;--acc:#b5532f;--acc2:#5f6b3c;--on:#fffaf2}
@media(prefers-color-scheme:dark){:root{--bg:#1c1613;--card:#262019;--ink:#f1e6d6;--mute:#a6978a;--line:#3d3229;--acc:#d9764f;--acc2:#a3b072;--on:#1c1613}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 Jost,system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:28px 22px 80px}.logo{height:110px;width:auto;mix-blend-mode:multiply}
@media(prefers-color-scheme:dark){.logo{filter:invert(1);mix-blend-mode:screen}}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;line-height:1.1;margin:0}h1{font-size:clamp(38px,9vw,60px)}h2{font-size:clamp(30px,7vw,42px)}
h3{font-size:26px;font-style:italic;border-bottom:1px solid var(--line);padding-bottom:6px;margin-top:34px}
.eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--acc);text-align:center}
.lead{color:var(--mute);max-width:540px;margin:16px auto 0}.bar{height:3px;background:var(--line);border-radius:3px;margin:16px 0 30px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);transition:width .4s}
.q{margin:0 0 36px}.l{font-weight:500;margin-bottom:4px}.hint{font-size:14px;color:var(--mute);margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:9px}.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 16px;font:inherit;font-size:15px;cursor:pointer}.chip:hover{border-color:var(--acc)}.chip.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}@media(max-width:620px){.grid3{grid-template-columns:repeat(2,1fr);gap:12px}}
.cap{font:italic 400 20px/1.2 "Cormorant Garamond",Georgia,serif;padding:10px 4px 2px;color:var(--ink)}.pk{font-size:12px;letter-spacing:.06em;color:var(--mute);padding:0 4px 8px}
.off-scale{background:var(--card);border-color:var(--line);color:var(--ink)}.on-scale{background:var(--acc2);border-color:var(--acc2);color:var(--on)}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:6px}
.rate{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.rate .n{flex:1;font-size:16px}.rate .b{display:flex;gap:6px}
.rate button{border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
.rate button.on{background:var(--acc);border-color:var(--acc);color:var(--on)}.rate button.on.m{background:var(--acc2);border-color:var(--acc2)}.rate button.on.x{background:var(--mute);border-color:var(--mute)}
input[type=text],textarea{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit}textarea{min-height:90px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:40px;position:sticky;bottom:0;background:#000000;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom));z-index:10}.btn{border:0;border-radius:999px;padding:14px 28px;font:500 15px Jost,sans-serif;letter-spacing:.06em;cursor:pointer;background:var(--acc);color:var(--on);text-decoration:none;display:inline-block;transition:all .3s}.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.18)}.btn:disabled{opacity:.6}.btn.g{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.foot{margin-top:56px;text-align:center;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--mute)}
.strip{display:flex;height:34px;border-radius:4px;overflow:hidden;margin:10px 0 18px}.strip i{display:block}
.row{display:flex;align-items:center;gap:10px;font-size:14px;margin:6px 0}.row b{width:190px;font-weight:400}.row u{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}.row u i{display:block;height:100%;background:var(--acc)}.row em{width:44px;font-style:normal;color:var(--mute);text-align:right}
.printonly{display:none}pre{white-space:pre-wrap;font:13px/1.55 Jost,sans-serif}
@media print{body{background:#fff;color:#000}.screen{display:none!important}.printonly{display:block}.logo{filter:none;mix-blend-mode:multiply}}</style></head>

const apply=d=>{if(restored||!d||typeof d!=="object")return;restored=true;window.__fyDraftReady=true;if(d.answers&&typeof d.answers==="object")setA(p=>({...p,...d.answers}));const n=Number(d.step);if(Number.isInteger(n)&&n>=-1&&n<S.length)setSt(n)};
const ok=o=>{try{const h=new URL(o).hostname;return /(^|\.)felemaye\.com$|\.framer\.(app|website|ai)$|(^|\.)framer\.com$|(^|\.)framercanvas\.com$/.test(h)}catch(e){return false}};
const on=e=>{if(e.source!==window.parent||!ok(e.origin))return;if(e.data&&e.data.type==="fy-survey-restore")apply(e.data)};
window.addEventListener("message",on);
if(EMBED){try{window.parent.postMessage({type:"fy-survey-ready"},"*")}catch(e){}}
const t=setTimeout(()=>{if(!IS_TEST){try{const s=localStorage.getItem(KEY);if(s)apply(JSON.parse(s))}catch(e){}}window.__fyDraftReady=true;tick(n=>n+1)},EMBED?1500:0);
return()=>{window.removeEventListener("message",on);clearTimeout(t)}},[]);
useEffect(()=>{if(done||!window.__fyDraftReady)return;const KEY="fy-survey-draft:"+(CLIENT_ID||"anon")+":"+(PROJECT_ID||"");
if(!IS_TEST){try{localStorage.setItem(KEY,JSON.stringify({answers:A,step:st,at:Date.now()}))}catch(e){}}
if(window.parent!==window){try{window.parent.postMessage({type:"fy-survey-state",answers:A,step:st},"*");window.parent.postMessage({type:"fy-survey-height",h:document.documentElement.scrollHeight},"*")}catch(e){}}},[A,st,done]);
useEffect(()=>{if(!done)return;try{localStorage.removeItem("fy-survey-draft:"+(CLIENT_ID||"anon")+":"+(PROJECT_ID||""))}catch(e){}},[done]);

const toggle=(id,v,max)=>setA(p=>{let a=[...(p[id]||[])];const i=a.indexOf(v);if(i>-1)a.splice(i,1);else{if(max===1)a=[];if(a.length>=max)a.shift();a.push(v)}return{...p,[id]:a}});
const rate=(o,v)=>setA(p=>{const r={...(p.wish||{})};if(r[o]===v)delete r[o];else r[o]=v;return{...p,wish:r}});
function payload(){const voice=A.voice||"household",weight=CONFIG.weights[voice]??0.5,zs=shares(A),ws={};Z.forEach(z=>{ws[z]=+(zs[z]*weight).toFixed(4)});
const per={archetype:archetype(A)};AXES.forEach(a=>{per[a[0]]=A[a[0]]||null});
return{client_id:CLIENT_ID,project_id:PROJECT_ID,client_email:CLIENT_EMAIL,client_name:CLIENT_NAME,project_slug:PROJECT_SLUG,project_title:PROJECT_TITLE,is_test:IS_TEST,submitted_at:new Date().toISOString(),respondent_name:A.name||"",respondent_voice:voice,voice_weight:weight,zone_shares:zs,weighted_zone_scores:ws,personality:per,raw_responses:A,summary_text:summary(A),zone_shares_json:JSON.stringify(zs),weighted_zone_scores_json:JSON.stringify(ws),personality_json:JSON.stringify(per),raw_responses_json:JSON.stringify(A)}}
async function submit(){setBusy(true);setRes("");const p=payload();
try{if(CONFIG.webhookUrl.indexOf("http")!==0)throw new Error("Webhook URL is not set in CONFIG");
try{const r=await fetch(CONFIG.webhookUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});if(!r.ok)throw new Error("HTTP "+r.status);setRes("ok");notifyParent()}
catch(e){if(e instanceof TypeError){await fetch(CONFIG.webhookUrl,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(p)});setRes("ok");notifyParent()}else throw e}}
catch(e){setRes("fail:"+(e.message||e))}
setBusy(false);setDone(true)}
const copy=()=>{const t=summary(A);const ok=()=>{setCopied(true);setTimeout(()=>setCopied(false),1800)};try{navigator.clipboard.writeText(t).then(ok)}catch(e){}};
const logo=html`<header class="flex justify-center pt-4 pb-2"><img class="logo" alt="FELEMAYE" src=${LOGO}/></header>`;
const foot=html`<div class="foot">People first<div style=${{marginTop:"8px",letterSpacing:".14em",fontSize:"10px",opacity:.6}}></div></div>`;
if(done){const zs=shares(A),top=[...Z].sort((a,b)=>zs[b]-zs[a]);return html`<div class="wrap">
<div class="screen">${logo}<div class="text-center mt-4"><div class="eyebrow">Thank you${A.name?", "+A.name:""}</div><h1 class="mt-3 mb-3">Your design profile</h1>
<p class="lead">${res==="ok"?"Your answers have been sent securely to the studio, and a copy is saved in your project file.":"We could not reach the studio just now ("+res.replace("fail:","")+"). Nothing is lost. Please try again, or copy your answers and send them to Felema."}</p></div>
<h3>${archetype(A)}</h3>
<div class="mt-4">${AXES.map(a=>html`<div class="row"><b>${a[1]}</b><u><i style=${{width:((A[a[0]]||3)/5*100)+"%"}}></i></u><em class="w-28 text-left">${a[2]}</em></div>`)}</div>
<h3>What you value most</h3><div class="strip">${top.map((z,i)=>html`<i title=${z} style=${{flex:Math.max(zs[z],0.01),background:ZC[Z.indexOf(z)]}}></i>`)}</div>
${top.slice(0,4).map(z=>html`<div class="row"><b>${z}</b><u><i style=${{width:Math.round(zs[z]*100*2.2)+"%",background:ZC[Z.indexOf(z)]}}></i></u><em>${Math.round(zs[z]*100)}%</em></div>`)}
<div class="flex flex-wrap justify-center gap-3 mt-10">${res!=="ok"&&html`<button class="btn" disabled=${busy} onClick=${submit}>${busy?"Sending…":"Try again"}</button>`}
${res==="ok"&&html`<button class="btn" onClick=${enterSuite}>Enter your suite</button>`}<button class="btn" onClick=${()=>window.print()}>Download PDF summary</button><button class="btn g" onClick=${copy}>${copied?"Copied":"Copy my answers"}</button><button class="btn g" onClick=${()=>setDone(false)}>Edit answers</button></div>${foot}</div>
<div class="printonly"><img class="logo" alt="FELEMAYE" src=${LOGO}/><pre>${summary(A)}</pre></div></div>`}
if(st<0)return html`<div class="wrap">${logo}<div class="text-center pt-6"><div class="eyebrow">${CLIENT_NAME?"Welcome, "+CLIENT_NAME.split(" ")[0]+(PROJECT_ADDR?" · "+PROJECT_ADDR:""):(PROJECT_ADDR||"Design intent")}</div><h1 class="mt-4">${PT1&&html`${PT1}<br/>`}<em>${PT2}</em></h1><p class="lead">Before we draw a single line, we want to know the people who will live in this space: how you gather, rest, play and dream. It takes about fifteen minutes, and every answer shapes the design.</p><div class="mt-10"><button class="btn" onClick=${()=>setSt(0)}>Begin</button></div></div>${foot}</div>`;
const s=S[st],last=st===S.length-1;
const Q=q=>{const v=A[q.id],mx=q.y==="one"?1:q.max;return html`<div class="q" key=${q.id}>${q.l&&html`<div class="l">${q.l}</div>`}
${(q.y==="multi"||q.y==="one")&&html`<div>${q.max>1&&html`<div class="hint">Choose up to ${q.max}</div>`}<div class="chips">${q.o.map(o=>html`<button type="button" class=${cls("chip transition-all duration-300 hover:-translate-y-0.5 hover:shadow-md",(v||[]).includes(o)&&"on")} onClick=${()=>toggle(q.id,o,mx)}>${o}</button>`)}</div></div>`}
${q.y==="voice"&&html`<div class="chips">${VOICES.map(o=>html`<button type="button" class=${cls("chip transition-all duration-300 hover:-translate-y-0.5",(A.voice||"")===o[0]&&"on")} onClick=${()=>put("voice",o[0])}>${o[1]}</button>`)}</div>`}
${q.y==="vis"&&html`<div><div class="hint">Choose up to ${q.max}</div><div class="grid3">${q.o.map(o=>html`<${VisCard} o=${o} on=${(v||[]).includes(o[0])} pick=${()=>toggle(q.id,o[0],q.max)}/>`)}</div></div>`}
${q.y==="pal"&&html`<div><div class="hint">${q.h}</div><div class="grid3">${P.map(p=>html`<${PalCard} p=${p} on=${(v||[]).includes(p[0])} pick=${()=>toggle("col",p[0],2)}/>`)}</div></div>`}
${q.y==="scale"&&html`<${Scale} q=${q} v=${v} set=${n=>put(q.id,n)}/>`}
${q.y==="rate"&&html`<div>${Z.map(z=>html`<div key=${z}><h3>${z}</h3>${W[z].map(o=>html`<div class="rate" key=${o}><div class="n">${o}</div><div class="b">${["Essential","Maybe","Pass"].map(b=>html`<button type="button" class=${cls("transition-all duration-300",(A.wish||{})[o]===b&&"on "+(b==="Maybe"?"m":b==="Pass"?"x":""))} onClick=${()=>rate(o,b)}>${b}</button>`)}</div></div>`)}</div>`)}</div>`}
${q.y==="text"&&(q.id==="name"?html`<input type="text" value=${v||""} onInput=${e=>put(q.id,e.target.value)}/>`:html`<textarea value=${v||""} onInput=${e=>put(q.id,e.target.value)}></textarea>`)}
${q.y==="upload"&&html`<div><div class="hint">Photos, sketches or existing surveys of the home can go straight into our shared folder.</div>${DRIVE?html`<a class="btn g" href=${DRIVE} target="_blank" rel="noopener">Open shared folder</a>`:html`<div class="hint">A private upload area opens in your studio suite once you finish.</div>`}</div>`}</div>`};
return html`<div class="wrap">${logo}<div class="eyebrow mt-4">Step ${st+1} of ${S.length}</div><div class="bar"><i style=${{width:((st+1)/S.length*100)+"%"}}></i></div>
<h2>${s.t}</h2><p class="hint" style=${{margin:"6px 0 30px",fontSize:"16px"}}>${s.s}</p>${s.q.map(Q)}
<div class="nav"><button class="btn g" onClick=${()=>setSt(st-1)}>${st?"Back":"Intro"}</button>${last?html`<button class="btn" disabled=${busy} onClick=${submit}>${busy?"Sending…":"Finish & Submit Profile"}</button>`:html`<button class="btn" onClick=${()=>setSt(st+1)}>Continue</button>`}</div>${foot}</div>`}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);

</script></body></html>
